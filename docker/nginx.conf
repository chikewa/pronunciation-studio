# Pronunciation Studio — nginx config (frontend + API proxy, one origin).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow 20 MB audio uploads through the proxy.
    client_max_body_size 25m;

    # Long first analysis runs happen in a worker thread; the browser only
    # polls the status endpoint, so no special timeouts are needed here.

    # API -> backend container (compose service name "backend").
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed; cache them hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
